[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
crossterm = "0.29.0"
futures-util = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thirtyfour = "0.37.5"
throbber-widgets-tui = "0.11.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
tui-input = "0.15.4"
